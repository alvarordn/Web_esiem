<div class="field {% if field.field.widget.input_type == 'checkbox' %}flex items-start gap-2{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}
    <label for="{{ field.id_for_label }}" class="!font-normal !mb-0">{{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="text-gray-500 font-normal">(opcional)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {% endif %}
  {{ field.errors }}
</div>
