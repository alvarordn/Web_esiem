{# Call to action for companies without an invitation: write to the generic mailbox. #}
<aside class="relative overflow-hidden rounded-2xl bg-rojo text-white p-6 md:p-8 shadow-lg ring-4 ring-oro/60 flex flex-col md:flex-row md:items-center gap-5 justify-between">
  <div class="flex items-start gap-4">
    <span class="shrink-0 grid place-items-center w-12 h-12 rounded-full bg-oro text-white" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
    </span>
    <div>
      <p class="font-display text-2xl md:text-3xl">¿Quiere tu empresa estar en {{ event.edition_name }}?</p>
      <p class="mt-1 text-white/90">Escríbenos a <a href="mailto:{{ general_email }}" class="font-semibold text-oro underline underline-offset-2 hover:text-white break-all">{{ general_email }}</a> y te contaremos cómo participar.</p>
    </div>
  </div>
  <a href="mailto:{{ general_email }}?subject={{ 'Participación en '|urlencode }}{{ event.edition_name|urlencode }}" class="btn btn-accent shrink-0 self-start md:self-auto">Escríbenos</a>
</aside>
