<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Barlow Semi Condensed, Arial Narrow, Arial, sans-serif">
  <title>Medidas del stand ESIEM (en metros)</title>
  <!-- Redrawn from the old esiem.es "medidas del stand" image (stand03.jpg), same dimension labels. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d1d1b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#921D1A"/>
    </marker>
    <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F6E7C8"/><stop offset="1" stop-color="#EBD3A4"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#E2C690"/><stop offset="1" stop-color="#EFDAB0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="30" font-weight="700" font-style="italic" fill="#002F7D">Medidas del stand (en metros)</text>

  <!-- floor -->
  <polygon points="70,665 830,665 870,725 30,725" fill="#B8322B"/>
  <!-- side panels (perspective) -->
  <polygon points="70,190 150,205 150,650 70,665" fill="url(#side)" stroke="#ffffff" stroke-width="6"/>
  <polygon points="830,190 750,205 750,650 830,665" fill="url(#side)" stroke="#ffffff" stroke-width="6"/>
  <line x1="110" y1="198" x2="110" y2="657" stroke="#ffffff" stroke-width="5"/>
  <line x1="790" y1="198" x2="790" y2="657" stroke="#ffffff" stroke-width="5"/>
  <!-- back wall: three modules -->
  <rect x="150" y="205" width="600" height="445" fill="#ffffff"/>
  <rect x="158" y="215" width="190" height="425" fill="url(#wood)"/>
  <rect x="356" y="215" width="188" height="425" fill="url(#wood)"/>
  <rect x="552" y="215" width="190" height="425" fill="url(#wood)"/>

  <!-- platabanda -->
  <rect x="60" y="70" width="780" height="120" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <rect x="80" y="86" width="740" height="70" fill="url(#wood)"/>
  <text x="450" y="182" text-anchor="middle" font-size="15" fill="#6b7280" letter-spacing="2">PLATABANDA</text>

  <!-- platabanda widths -->
  <line x1="64" y1="104" x2="836" y2="104" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="420" y="88" width="60" height="22" fill="#F6E7C8"/>
  <text x="450" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b">2,79</text>
  <line x1="84" y1="140" x2="816" y2="140" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="420" y="124" width="60" height="22" fill="#EFDBB3"/>
  <text x="450" y="141" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b">2,93</text>

  <!-- platabanda heights -->
  <line x1="740" y1="88" x2="740" y2="154" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="732" y="121" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1b" transform="rotate(-90 732 121)">0,26</text>
  <line x1="862" y1="72" x2="862" y2="203" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="842" y1="70" x2="870" y2="70" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="832" y1="205" x2="870" y2="205" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="882" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1b" transform="rotate(-90 882 138)">0,40</text>

  <!-- interior width -->
  <line x1="160" y1="330" x2="740" y2="330" stroke="#921D1A" stroke-width="2.5" marker-start="url(#r)" marker-end="url(#r)"/>
  <rect x="420" y="306" width="60" height="22" fill="#F1DEB8"/>
  <text x="450" y="324" text-anchor="middle" font-size="24" font-weight="700" fill="#921D1A">2,93</text>

  <!-- depth (left side) -->
  <line x1="74" y1="370" x2="146" y2="346" stroke="#921D1A" stroke-width="2.5" marker-start="url(#r)" marker-end="url(#r)"/>
  <text x="88" y="350" font-size="20" font-weight="700" fill="#921D1A" transform="rotate(-18 88 350)">1,96</text>
  <line x1="74" y1="410" x2="146" y2="386" stroke="#921D1A" stroke-width="2.5" marker-start="url(#r)" marker-end="url(#r)"/>
  <text x="88" y="434" font-size="20" font-weight="700" fill="#921D1A" transform="rotate(-18 88 434)">1,95</text>

  <!-- module widths -->
  <line x1="160" y1="530" x2="346" y2="530" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="253" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b">0,95</text>
  <line x1="152" y1="585" x2="352" y2="585" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="253" y="575" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b">0,99</text>

  <!-- wall heights -->
  <line x1="650" y1="217" x2="650" y2="638" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="640" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b" transform="rotate(-90 640 440)">2,56</text>
  <line x1="710" y1="207" x2="710" y2="662" stroke="#1d1d1b" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="700" y="440" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1b" transform="rotate(-90 700 440)">2,70</text>

  <text x="450" y="752" text-anchor="middle" font-size="16" fill="#6b7280">Stand modular blanco · 3 × 2 m · 2,5 m de alto</text>
</svg>
